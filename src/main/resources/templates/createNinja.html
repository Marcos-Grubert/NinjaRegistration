<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Ninja</title>
    <link rel="stylesheet" th:href="@{/css/pages/createNinja.css}">
</head>
<body>
    <header>Cadastro de Ninjas</header>
    <aside class="sidebar">
        <nav>
            <ul class="menu">

                <li>
                    <a href="/ninja/ui/showAll">🏠 Dashboard</a>
                </li>

                <li>
                    <a href="/ninja/ui/form">➕ Criar Ninja</a>
                </li>

                <li>
                    <a href="/ninja/ui/showAll">📋 Listar Ninjas</a>
                </li>

            </ul>
        </nav>
    </aside>
    <main>
        <form th:action="@{/ninja/ui/createNinja}" th:object="${ninja}" method="post">

            <label>Nome</label>
            <input type="text" th:field="*{name}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Idade</label>
            <input type="number" th:field="*{age}" required>

            <label>Rank</label>
            <input type="text" th:field="*{rank}" required>

            <label>Missão</label>
            <select th:field="*{mission.id}" required>
                <option value="">Selecione</option>
                <option th:each="mission : ${missions}"
                        th:value="${mission.id}"
                        th:text="${mission.name}">
                </option>
            </select>
            <button type="submit">Criar Ninja</button>
        </form>
    </main>
</body>
</html>
